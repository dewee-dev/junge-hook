name: Build APK

# 只提供手动触发：仓库页面 Actions 标签页 → Build APK → Run workflow
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        type: choice
        default: both
        options:
          - both
          - debug
          - release
      version_name:
        description: '版本名（可选，留空沿用 app/build.gradle 里的值）'
        type: string
        required: false
        default: ''
      run_tests:
        description: '构建前运行单元测试'
        type: boolean
        default: false
      create_release:
        description: '构建成功后创建 GitHub Release（附 APK）'
        type: boolean
        default: false

# 创建 Release 需要写权限；其余步骤只用读权限
permissions:
  contents: write

# 同一分支只保留最新一次构建，避免排队堆积
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.11.1'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build:
    name: Build ${{ inputs.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # AGP 8.7.3 要求 JDK 17
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runner 自带 Android SDK，这里补齐 compileSdk 36 需要的平台包
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台与构建工具
        run: |
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}"

      # 仓库里的 gradle-wrapper.properties 指向本机 G: 盘离线包，
      # 且缺少 gradlew（Unix 脚本），所以这里固定 Gradle 版本直接调用 gradle 命令。
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 可选：用 Secrets 里的签名证书产出可直接安装的 release 包
      # 需要的 Secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      #                 ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: 注入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice title=未配置签名::缺少 ANDROID_KEYSTORE_BASE64，release 包将以未签名形式产出（debug 包不受影响）"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > key.properties
          echo "::notice title=签名已启用::release 包将使用密钥 ${KEY_ALIAS} 签名"

      - name: 覆盖版本名
        if: inputs.version_name != ''
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          grep -n 'versionName' app/build.gradle

      - name: 运行单元测试
        if: inputs.run_tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: 构建 APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          case "$BUILD_TYPE" in
            debug)   TASKS=":app:assembleDebug" ;;
            release) TASKS=":app:assembleRelease" ;;
            *)       TASKS=":app:assembleDebug :app:assembleRelease" ;;
          esac
          echo "执行：gradle ${TASKS}"
          gradle ${TASKS} --stacktrace

      - name: 收集产物
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -type f -exec cp {} out/ \;
          ls -lh out
          if [ -z "$(ls -A out)" ]; then
            echo "::error title=未产出 APK::构建成功但没有找到 APK 文件"
            exit 1
          fi
          echo "apk_count=$(ls -1 out/*.apk | wc -l)" >> "$GITHUB_OUTPUT"
          {
            echo "## 构建产物"
            echo
            echo "| 文件 | 大小 | SHA256 |"
            echo "| --- | --- | --- |"
            for f in out/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)…\` |"
            done
            echo
            echo "构建类型：\`${{ inputs.build_type }}\` ・ 提交：\`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_type }}-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 创建 Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          VER="${VERSION_NAME:-$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -1)}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "v${VER} (${BUILD_TYPE}) #${GITHUB_RUN_NUMBER}" \
            --notes "手动构建产物，基于提交 ${GITHUB_SHA::7}。" \
            out/*.apk
          echo "::notice title=Release 已创建::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
